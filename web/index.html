<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyTogether — food, services, and more for the community.">

  <!-- PWA -->
  <meta name="theme-color" content="#ED3973">

  <!-- iOS meta tags & icons (aligned with myshop — no viewport-fit=cover) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyTogether">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>MyTogether</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <script>
    // Lazy-load Maps so iOS PWA startup stays interactive (main branch loads
    // this eagerly; PWA-Production defers until places/maps are needed).
    window.ensureGoogleMapsLoaded = function () {
      if (window.google && window.google.maps) {
        window.googleMapsApiReady = true;
        return Promise.resolve();
      }
      if (window._googleMapsLoadPromise) {
        return window._googleMapsLoadPromise;
      }
      window._googleMapsLoadPromise = new Promise(function (resolve, reject) {
        window.initGoogleMapsApi = function () {
          window.googleMapsApiReady = true;
          resolve();
        };
        var script = document.createElement('script');
        script.async = true;
        script.defer = true;
        script.src =
          'https://maps.googleapis.com/maps/api/js?key=AIzaSyDDp0l6jJqFbpSzfX7tBN2nsFkSY9x_5RU&libraries=places&callback=initGoogleMapsApi';
        script.onerror = function () {
          reject(new Error('Google Maps script failed to load'));
        };
        document.head.appendChild(script);
      });
      return window._googleMapsLoadPromise;
    };
  </script>
  <script src="maps_places_bridge.js"></script>
  <style id="splash-screen-style">
    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background-color: #FFFFFF;
      background-size: 100% 100%;
    }

    /* Splash must never intercept taps if Flutter forgets to remove it. */
    #splash,
    #splash-branding {
      pointer-events: none;
    }

    flutter-view,
    flt-glass-pane {
      touch-action: manipulation;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    setTimeout(removeSplashFromWeb, 4000);
  </script>
  <script id="firebase-messaging-sw-script">
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js', {
        scope: '/firebase-cloud-messaging-push-scope',
      }).catch(function (err) {
        console.warn('[FCM] Service worker registration failed:', err);
      });
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
